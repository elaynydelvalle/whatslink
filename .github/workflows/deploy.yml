name: Deploy para HostGator

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Digite DEPLOY para confirmar o envio ao servidor'
        required: true
        default: ''

jobs:
  deploy:
    name: Publicar no HostGator
    runs-on: ubuntu-latest

    steps:
      - name: Verificar confirmação
        if: github.event.inputs.confirm != 'DEPLOY'
        run: |
          echo "Confirmacao invalida. Digite exatamente DEPLOY para prosseguir."
          exit 1

      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Disparar pull no cPanel Git Version Control
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
          CPANEL_REPO_PATH: ${{ secrets.CPANEL_REPO_PATH }}
        run: |
          RESPONSE=$(curl -sk -H "Authorization: cpanel $CPANEL_USER:$CPANEL_TOKEN" \
            "https://$CPANEL_HOST:2083/execute/VersionControl/update" \
            --data-urlencode "repository_root=$CPANEL_REPO_PATH")
          echo "Resposta: $RESPONSE"
          echo "$RESPONSE" | python3 -c "import sys,json; r=json.load(sys.stdin); exit(0 if r.get('status')==1 else 1)"

      - name: Deploy concluido
        run: echo "Deploy disparado com sucesso!"
