name: Deploy para HostGator

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Digite DEPLOY para confirmar o envio ao servidor'
        required: true
        default: ''

jobs:
  deploy:
    name: Publicar no HostGator
    runs-on: ubuntu-latest

    steps:
      - name: Verificar confirmação
        if: github.event.inputs.confirm != 'DEPLOY'
        run: |
          echo "❌ Confirmação inválida. Digite exatamente DEPLOY para prosseguir."
          exit 1

      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, openssl, zip, curl

      - name: Instalar dependências (sem dev)
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Criar .env de produção
        env:
          SECRET_APP_URL: ${{ secrets.APP_URL }}
          SECRET_APP_KEY: ${{ secrets.APP_KEY }}
          SECRET_DB_HOST: ${{ secrets.DB_HOST }}
          SECRET_DB_DATABASE: ${{ secrets.DB_DATABASE }}
          SECRET_DB_USERNAME: ${{ secrets.DB_USERNAME }}
          SECRET_DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          cat > .env <<EOF
          APP_NAME=WhatsLink
          APP_ENV=production
          APP_KEY=$SECRET_APP_KEY
          APP_DEBUG=false
          APP_URL=$SECRET_APP_URL
          LOG_CHANNEL=stack
          LOG_LEVEL=error
          DB_CONNECTION=mysql
          DB_HOST=$SECRET_DB_HOST
          DB_PORT=3306
          DB_DATABASE=$SECRET_DB_DATABASE
          DB_USERNAME=$SECRET_DB_USERNAME
          DB_PASSWORD=$SECRET_DB_PASSWORD
          SESSION_DRIVER=file
          CACHE_STORE=file
          QUEUE_CONNECTION=sync
          EOF

      - name: Gerar chave da aplicação (se necessário)
        run: php artisan key:generate --force

      - name: Otimizar para produção
        run: |
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache

      - name: Deploy via FTP para HostGator
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_PATH }}
          protocol: ftp
          port: 21
          security: loose
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/tests/**
            **/.env.example
            **/storage/framework/sessions/**
            **/storage/framework/cache/data/**
            **/storage/logs/**

      - name: ✅ Deploy concluído
        run: echo "Deploy realizado com sucesso!"
